##################################################
#  Nevermore Stealthmax PCB 3 - Klipper Config
#  Docs: https://docs.isiks.tech/Nevermore/Controller/
##################################################


### ==========================================
### MCU CONNECTION
### ==========================================
# Uncomment ONE of the two lines below, then replace the placeholder
# with your PCB's actual address or UUID.
#   USB:  Run  ls /dev/serial/by-id/*
#   CAN:  Run  ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0

[mcu SM]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_0C001F000E50323756343420-if00
# canbus_uuid: 123456789012


### ==========================================
### AIR QUALITY SENSORS (BME280 + SGP40)
### ==========================================

# Required by the SGP40 Klipper plugin. Do not remove.
[sgp40]

# The PCB has two I2C connectors (SENSORS1 and SENSORS2).
# In the below config, exhaust (OUT) sensors are wired to 
# SENSORS1 and intake (IN) sensors use SENSORS2. Swap the 
# i2c_bus values if your wiring is reversed.

#   i2c_bus           | PCB Connector
#   i2c1_PB8_PB9      | SENSORS1
#   i2c2_PB10_PB11    | SENSORS2

# Below config uses BME280 I2C addresses used on Isik's Tech
# Nevermore Sensor boards. If you are using Aliexpress/other
# BME280 modules, verify their I2C address and edit below if needed.

#[temperature_sensor BME_OUT]
#sensor_type: BME280
#i2c_address: 119
#i2c_mcu: SM
#i2c_bus: i2c1_PB8_PB9

#[temperature_sensor BME_IN]
#sensor_type: BME280
#i2c_address: 119
#i2c_mcu: SM
#i2c_bus: i2c2_PB10_PB11

#[temperature_sensor SGP_OUT]
#sensor_type: SGP40
#i2c_mcu: SM
#i2c_bus: i2c1_PB8_PB9
#ref_temp_sensor: bme280 BME_OUT
#ref_humidity_sensor: bme280 BME_OUT

#[temperature_sensor SGP_IN]
#sensor_type: SGP40
#i2c_mcu: SM
#i2c_bus: i2c2_PB10_PB11
#ref_temp_sensor: bme280 BME_IN
#ref_humidity_sensor: bme280 BME_IN


### ==========================================
### RGB LEDs
### ==========================================

[neopixel SM_RGB]
pin: SM:PA0
chain_count: 16
color_order: GRB
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0


### ==========================================
### FAN
### ==========================================

[fan_generic Filter]
pin: SM:PB14
tachometer_pin: SM:PB15
tachometer_ppr: 2


### ==========================================
### STEALTHMAX VENT SERVO
### ==========================================
# Uncomment the blocks below and edit the angles if you have a 
# vent servo installed.
# If you encounter MCU resets, your servo is either not moving
# freely (clean 3DP parts), or hitting a wall (edit angles).

# [servo SM_Vent]
# pin: SM:PD0

# [gcode_macro VENT_OPEN]
# variable_open_angle: 47
# gcode:
#     SET_SERVO SERVO=SM_Vent ANGLE={open_angle}
#     UPDATE_DELAYED_GCODE ID=VENT_DEACTIVATE DURATION=5

# [gcode_macro VENT_CLOSE]
# variable_close_angle: 67
# gcode:
#     SET_SERVO SERVO=SM_Vent ANGLE={close_angle}
#     UPDATE_DELAYED_GCODE ID=VENT_DEACTIVATE DURATION=5

# [delayed_gcode VENT_DEACTIVATE]
# gcode:
#     SET_SERVO SERVO=SM_Vent WIDTH=0


### ==========================================
### UV LEDs (optional)
### ==========================================
# Uncomment below if using UV LEDs.

# [output_pin uv]
# pin: SM:PA1
# pwm: true
# shutdown_value: 0
# value: 0
# cycle_time: 0.01

# If your UV LEDs have thermistors, uncomment the section
# for the connector you used for your thermistor in the
# thermistors section below. You may need to edit the
# sensor_type to match the thermistor you're using.


### ==========================================
### PELTIER COOLING (optional)
### ==========================================
# Uncomment below if using a peltier for carbon cooling.

# [output_pin peltier]
# pin: SM:PD3
# pwm: true
# shutdown_value: 0
# value: 0
# cycle_time: 0.01

# If your peltier setup has thermistors, uncomment the 
# section(s) for the connector(s) you used for your thermistor(s)
# in the thermistors section below. You may need to edit the
# sensor_type to match the thermistor(s) you're using.



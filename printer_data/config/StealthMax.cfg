### ==========================================
### OVER TEMPERATURE PROTECTION — DO NOT REMOVE
### ==========================================
# These sensors are used as an extra layer of protection. 
# DO NOT REMOVE OR COMMENT OUT.
# To hide them from the Mainsail dashboard without disabling them,
# add a _ before the name (e.g. _SM_PCB).

[temperature_sensor SM_PCB]
sensor_type: Generic 3950
sensor_pin: SM:PA2
pullup_resistor: 4700
min_temp: 0
max_temp: 100

[temperature_sensor SM_MCU]
sensor_type: temperature_mcu
sensor_mcu: SM
min_temp: 0
max_temp: 80
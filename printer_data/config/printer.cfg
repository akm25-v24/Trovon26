#####################################################################
#   Macros
#####################################################################
    
    
[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    NOZZLE_CLEAN
    QUAD_GANTRY_LEVEL
    G28
    ##  Uncomment for for your size printer:
    #--------------------------------------------------------------------
    ##  Uncomment for 250mm build
    #G0 X125 Y125 Z30 F3600
    
    ##  Uncomment for 300 build
    #G0 X150 Y150 Z30 F3600
    
    ##  Uncomment for 350mm build
    G0 X175 Y175 Z30 F3600
    #--------------------------------------------------------------------
    RESTORE_GCODE_STATE NAME=STATE_G32
    
    
#####################################################################
#  PRINT_START  – Voron 2.4 350 • TAP • on-demand mesh only
#####################################################################
[gcode_macro PRINT_START]
description: "Heat, TAP home, optional QGL, on-demand mesh, purge & wipe"
gcode:
    # --- Commented out to prevent the "Print Cancelled" bug ---
    # PREFLIGHT_CHECK 
    
    {% set BED     = params.BED|default(60)|float %}
    {% set NOZ     = params.EXTRUDER|default(200)|float %}
    {% set QGLrun  = params.QGL|default(1)|int %}
    {% set DO_MESH = params.MESH|default(0)|int %}
    
    G90                              ; Use absolute coordinates
    
    M140 S{BED}
    M190 S{BED}
    M104 S{NOZ}
    
    G28                              ; TAP home
    
    NOZZLE_CLEAN                   ; Temporarily disabled for troubleshooting
    
    {% if QGLrun > 0 %}
      QUAD_GANTRY_LEVEL INITIAL_HEIGHT=5
    {% endif %}
    
    {% if DO_MESH > 0 %}
      # CLEAN_NOZZLE                 ; Temporarily disabled for troubleshooting
      BED_MESH_CALIBRATE PROBE_COUNT=5,5
    {% else %}
      BED_MESH_PROFILE LOAD=Default100  ; use the mesh you saved previously
    {% endif %}
    
    M109 S{NOZ}
    
    ; ---- purge ----
    G90           ; Ensure absolute positioning for the purge
    G92 E0        ; Reset Extruder
    G1 Z0.3 X5 Y5 F6000
    G1 X320 E20   F1000
    G1 X330       F6000
    G1 Z5         F6000
    G92 E0        ; Reset Extruder again after purge
    M83           ; Set extruder to relative mode (Orca Slicer default)
    
    M118 Purge complete – printing…
    SKEW_PROFILE LOAD=Califlower

#####################################################################
#  PRINT_END  – Voron 2.4 350 • TAP
#####################################################################
[gcode_macro PRINT_END]
description: "Retract, park, cool, disable after bed < 50 °C"
gcode:
    SET_SKEW CLEAR=1
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    M400
    G92 E0
    G1 E-5.0 F1800                      ; retract
    
    TURN_OFF_HEATERS
    
    G90
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y-2} F3600
    M107                                   ; fan off
    
    ; keep steppers engaged until the bed cools (avoids gantry droop)
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=50
    M84
    M118 Print finished
    

    
    
[gcode_macro CHOME]
description: Homes XYZ axis only if printer is in a non-homed state
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
    {% endif %}
    
[gcode_macro FRONT]
description: Moves the toolhead to the front
gcode:
    CHOME
    {% set x_center = printer.toolhead.axis_maximum.x|float / 2.0 %}
    {% set y_center = printer.toolhead.axis_maximum.y|float / 2.0 %}
    G90
    G1 X{x_center} Y10 F7800
    
[gcode_macro _LOGO_PENDING]
gcode:
    SET_LED LED=LED_light RED=0.15 GREEN=0.5 BLUE=0.75 WHITE=0 INDEX=1
    
[gcode_macro _LOGO_READY]
gcode:
    SET_LED LED=LED_light RED=0.99 GREEN=0.0 BLUE=0.0 WHITE=0 INDEX=1
    
[gcode_macro _LOGO_OFF]
gcode:
    SET_LED LED=LED_light RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=1
    
    
[gcode_macro _HEADLIGHT_ON]
gcode:
    SET_LED LED=LED_light RED=1 GREEN=1 BLUE=1 WHITE=1.0 INDEX=2 TRANSMIT=0
    SET_LED LED=LED_light RED=1 GREEN=1 BLUE=1 WHITE=1.0 INDEX=3
    
    
[gcode_macro _HEADLIGHT_OFF]
gcode:
    SET_LED LED=LED_light RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=LED_light RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=3
    
    
[gcode_macro UNLOAD_FILAMENT]
description: Unloads filament from toolhead
gcode:
    {% set EXTRUDER_TEMP = params.TEMP|default(230)|int %}
    {% set MIN_TEMP = params.TEMP|default(230)|float * 0.98 %}
    {% set CURRENT_TARGET = printer.extruder.target|float %}
    CHOME
    G91                         ; relative positioning
    G1 Z20                      ; move nozzle upwards
    FRONT                       ; move the toolhead to the front
    {% if EXTRUDER_TEMP != 0 %}
    _LOGO_PENDING
    {% if CURRENT_TARGET < EXTRUDER_TEMP %}
    M104 S{EXTRUDER_TEMP} ; only heat up if the current extruder is not already hot
    {% endif %}
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={MIN_TEMP} ; wait for min extrude temp to reach
    {% endif %}
    _LOGO_READY
    M83                         ; set extruder to relative mode
    G1 E10 F300                 ; extrude a little to soften tip
    G1 E-8 F3600                ; quickly retract a small amount to elimate stringing
    G4 P200                     ; pause for a short amount of time
    G1 E-50 F400                ; retract slowly the rest of the way
    G1 E-20 F300
    M400                        ; wait for moves to finish
    M117 Unload Complete!
    _LOGO_OFF
    
[gcode_macro LOAD_FILAMENT]
description: Loads new filament into toolhead
gcode:
    {% set EXTRUDER_TEMP = params.TEMP|default(230)|int %}
    {% set MIN_TEMP = params.TEMP|default(230)|float * 0.98 %}
    {% set CURRENT_TARGET = printer.extruder.target|float %}
    FRONT                       ; move the toolhead to the front
    {% if EXTRUDER_TEMP != 0 %}
    _LOGO_PENDING
    {% if CURRENT_TARGET < EXTRUDER_TEMP %}
    M104 S{EXTRUDER_TEMP} ; only heat up if the current extruder is not already hot
    {% endif %}
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={MIN_TEMP} ; wait for min extrude temp to reach
    {% endif %}
    _LOGO_READY
    _HEADLIGHT_ON
    M83                         ; set extruder to relative mode
    G1 E50 F300                 ; extrude slowlyL
    G1 E50 F300
    M400                        ; wait for moves to finish
    M117 Load Complete!
    _LOGO_OFF
    _HEADLIGHT_OFF


[gcode_macro _EXHAUST_VARS]
variable_base: 0.10
variable_hot: 0.50
variable_threshold: 60.0
variable_auto: 1
gcode:

[fan_generic exhaust_fan]
pin: PF6
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0

[delayed_gcode exhaust_fan_loop]
initial_duration: 1
gcode:
    {% set TEMP = printer["temperature_sensor chamber_temp"].temperature|float %}
    {% set BASE = printer["gcode_macro _EXHAUST_VARS"].base|float %}
    {% set HOT = printer["gcode_macro _EXHAUST_VARS"].hot|float %}
    {% set THRESHOLD = printer["gcode_macro _EXHAUST_VARS"].threshold|float %}
    {% set AUTO = printer["gcode_macro _EXHAUST_VARS"].auto|int %}

    {% if AUTO == 1 %}
        {% if TEMP >= THRESHOLD %}
            SET_FAN_SPEED FAN=exhaust_fan SPEED={HOT}
        {% else %}
            SET_FAN_SPEED FAN=exhaust_fan SPEED={BASE}
        {% endif %}
        UPDATE_DELAYED_GCODE ID=exhaust_fan_loop DURATION=5
    {% endif %}

[gcode_macro EXHAUST_AUTO_ON]
gcode:
    SET_GCODE_VARIABLE MACRO=_EXHAUST_VARS VARIABLE=auto VALUE=1
    UPDATE_DELAYED_GCODE ID=exhaust_fan_loop DURATION=1

[gcode_macro EXHAUST_AUTO_OFF]
gcode:
    SET_GCODE_VARIABLE MACRO=_EXHAUST_VARS VARIABLE=auto VALUE=0
    UPDATE_DELAYED_GCODE ID=exhaust_fan_loop DURATION=0
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0

[gcode_macro EXHAUST_BASE]
gcode:
    SET_GCODE_VARIABLE MACRO=_EXHAUST_VARS VARIABLE=auto VALUE=0
    UPDATE_DELAYED_GCODE ID=exhaust_fan_loop DURATION=0
    SET_FAN_SPEED FAN=exhaust_fan SPEED={printer["gcode_macro _EXHAUST_VARS"].base|float}

[gcode_macro EXHAUST_SET]
gcode:
    {% set S = params.S|default(0.10)|float %}
    SET_GCODE_VARIABLE MACRO=_EXHAUST_VARS VARIABLE=auto VALUE=0
    UPDATE_DELAYED_GCODE ID=exhaust_fan_loop DURATION=0
    SET_FAN_SPEED FAN=exhaust_fan SPEED={S}
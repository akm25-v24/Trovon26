# macros.cfg – Custom print macros for Voron 2.4 350mm (Troodon 2.0 Pro)

# ─────────────────────────────────────────
# CLIENT VARIABLE – override defaults here
# ─────────────────────────────────────────
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: true
variable_custom_park_x: 30.0
variable_custom_park_y: 30.0
variable_custom_park_dz: 2.0
variable_retract: 1.5
variable_cancel_retract: 5.0
variable_speed_retract: 35.0
variable_unretract: 1.5
variable_speed_unretract: 35.0
variable_speed_hop: 15.0
variable_speed_move: 100.0
variable_park_at_cancel: true
variable_park_at_cancel_x: 30.0
variable_park_at_cancel_y: 350.0
variable_use_fw_retract: false
variable_idle_timeout: 0
gcode:
    # This macro is intentionally empty – values above are read as variables.

# ─────────────────────────────────────────
# PRINT START
# Slicer start gcode: PRINT_START BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature]
# ─────────────────────────────────────────
[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP      = params.BED_TEMP      | default(110) | float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP | default(240) | float %}
    {% set SOAK_MINUTES  = params.SOAK_MINUTES  | default(5)   | int   %}

    RESPOND MSG="PRINT_START – bed { BED_TEMP }°C, extruder { EXTRUDER_TEMP }°C"

    # Start heating (non-blocking) so the bed warms while we home
    M140 S{ BED_TEMP }
    M104 S150              # preheat extruder to probing temp (TAP-safe)

    # Home all axes
    G28

    # Quad Gantry Level
    QUAD_GANTRY_LEVEL
    G28 Z

    # Optional soak: wait for bed to reach temperature
    M190 S{ BED_TEMP }
    {% if SOAK_MINUTES > 0 %}
        RESPOND MSG="Soaking for { SOAK_MINUTES } minutes…"
        G4 P{ SOAK_MINUTES * 60 * 1000 }
    {% endif %}

    # Bed mesh calibration
    BED_MESH_CALIBRATE

    # Move to purge position and heat extruder to print temp
    G90
    G1 X5 Y5 Z5 F10000
    M109 S{ EXTRUDER_TEMP }

    # Purge line
    PURGE_LINE

    RESPOND MSG="PRINT_START complete – printing!"

# ─────────────────────────────────────────
# PRINT END
# ─────────────────────────────────────────
[gcode_macro PRINT_END]
gcode:
    # Safe anti-stringing move
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z] | min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           # wait for buffer to clear
    G92 E0                         # zero the extruder
    G1 E-5.0 F1800                 # retract 5mm

    TURN_OFF_HEATERS

    G90                            # absolute positioning
    G0 X{ x_safe } Y{ y_safe } Z{ z_safe } F20000
    G0 X{ th.axis_maximum.x / 2 } Y{ th.axis_maximum.y - 10 } F3600  # park nozzle at rear
    M107                           # turn off part fan

    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

# ─────────────────────────────────────────
# PURGE LINE – drawn along the left edge
# ─────────────────────────────────────────
[gcode_macro PURGE_LINE]
gcode:
    SAVE_GCODE_STATE NAME=BEFORE_PURGE
    G90
    G92 E0
    G1 X5   Y5   Z0.3 F10000
    G1 X5   Y60  Z0.3 F1500 E10
    G1 X5.4 Y60  Z0.3 F5000
    G1 X5.4 Y5   Z0.3 F1500 E20
    G92 E0
    G1 Z2 F3000
    RESTORE_GCODE_STATE NAME=BEFORE_PURGE

# ─────────────────────────────────────────
# LOAD / UNLOAD FILAMENT
# ─────────────────────────────────────────
[gcode_macro LOAD_FILAMENT]
gcode:
    {% set speed     = params.SPEED     | default(300) %}
    {% set max_vel   = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E350 F{ max_vel * 60 }      # fast load to near nozzle
    G1 E25  F{ speed }              # slow purge
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set speed   = params.SPEED   | default(300) %}
    {% set max_vel = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E25  F{ speed }              # purge a little
    G1 E-420 F{ max_vel * 60 }     # fast retract
    RESTORE_GCODE_STATE NAME=unload_state

# ─────────────────────────────────────────
# CALIBRATION HELPERS
# ─────────────────────────────────────────
[gcode_macro CALIBRATE_Z_OFFSET]
description: Home, QGL, then start Z offset calibration
gcode:
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    PROBE_CALIBRATE

[gcode_macro PID_EXTRUDER]
description: PID tune the extruder at 240°C
gcode:
    {% set TARGET = params.TARGET | default(240) | float %}
    PID_CALIBRATE HEATER=extruder TARGET={ TARGET }

[gcode_macro PID_BED]
description: PID tune the heated bed at 100°C
gcode:
    {% set TARGET = params.TARGET | default(100) | float %}
    PID_CALIBRATE HEATER=heater_bed TARGET={ TARGET }

# ─────────────────────────────────────────
# HEAT / COOL SHORTCUTS
# ─────────────────────────────────────────
[gcode_macro PREHEAT_ABS]
description: Preheat for ABS/ASA printing
gcode:
    M140 S110     # bed
    M104 S240     # extruder
    RESPOND MSG="Preheating for ABS – bed 110°C, extruder 240°C"

[gcode_macro PREHEAT_PLA]
description: Preheat for PLA printing
gcode:
    M140 S60      # bed
    M104 S220     # extruder
    RESPOND MSG="Preheating for PLA – bed 60°C, extruder 220°C"

[gcode_macro COOLDOWN]
description: Turn off all heaters and fans
gcode:
    TURN_OFF_HEATERS
    M107
    RESPOND MSG="Cooling down…"

# ─────────────────────────────────────────
# NOZZLE CLEAN  (optional brush at front-right)
# ─────────────────────────────────────────
[gcode_macro CLEAN_NOZZLE]
description: Wipe nozzle on silicone brush
variable_start_x: 306
variable_start_y: 353
variable_start_z: 2.5
variable_wipe_dist: -50
variable_wipe_qty: 5
variable_wipe_spd: 200
variable_raise_distance: 30
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X{ start_x } Y{ start_y } F{ wipe_spd * 60 }
    G1 Z{ start_z } F1500

    {% for wipes in range(1, wipe_qty + 1) %}
        G1 X{ start_x + wipe_dist } F{ wipe_spd * 60 }
        G1 X{ start_x }             F{ wipe_spd * 60 }
    {% endfor %}

    G1 Z{ raise_distance }

# ─────────────────────────────────────────
# BEEPER HELPER
# ─────────────────────────────────────────
[gcode_macro BEEP]
description: Emit a beep (requires [output_pin beeper] in printer.cfg)
gcode:
    {% set frequency = params.FREQ     | default(1000) | float %}
    {% set duration  = params.DURATION | default(100)  | int   %}
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0 / frequency }
    G4 P{ duration }
    SET_PIN PIN=beeper VALUE=0

# ─────────────────────────────────────────
# STATUS LED (Mini 12864 Neopixel)
# ─────────────────────────────────────────
[gcode_macro STATUS_READY]
gcode:
    SET_LED LED=btt_mini12864 RED=0 GREEN=0.3 BLUE=0 SYNC=0 TRANSMIT=1

[gcode_macro STATUS_BUSY]
gcode:
    SET_LED LED=btt_mini12864 RED=0.4 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1

[gcode_macro STATUS_PRINTING]
gcode:
    SET_LED LED=btt_mini12864 RED=0 GREEN=0 BLUE=0.4 SYNC=0 TRANSMIT=1
